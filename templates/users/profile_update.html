{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Cập Nhật Hồ Sơ{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Cập Nhật Thông Tin Cá Nhân</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary mt-3">Lưu Thay Đổi</button>
                    <a href="{% url 'users:profile' %}" class="btn btn-secondary mt-3">Hủy</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
