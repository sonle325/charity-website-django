{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Đặt Lại Mật Khẩu{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Đặt Lại Mật Khẩu</h3>
            </div>
            <div class="card-body">
                <p>Quên mật khẩu? Nhập địa chỉ email của bạn dưới đây, và chúng tôi sẽ gửi email hướng dẫn đặt lại mật khẩu.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary mt-3">Gửi Email Đặt Lại</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
