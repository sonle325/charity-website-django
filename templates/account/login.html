{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Đăng Nhập{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="card-title mb-0">Đăng Nhập</h3>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="id_remember" name="remember">
                        <label class="form-check-label" for="id_remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <button type="submit" class="btn btn-primary px-4">Đăng Nhập</button>
                        <a href="{% url 'users:demo_login' %}" class="btn btn-outline-secondary">Đăng nhập Demo</a>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_reset_password' %}" class="btn btn-link">Quên mật khẩu?</a>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">Chưa có tài khoản? <a href="{% url 'account_signup' %}">Đăng ký</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
