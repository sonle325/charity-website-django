{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Donation{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Create a Donation</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Submit Donation</button>
    </form>
</div>
{% endblock %}
